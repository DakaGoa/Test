name: skin

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - "skin/config.json"
      - "skin/render.mjs"
      - "skin/skin.mjs"
      - ".github/workflows/skin.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test skin/skin.test.mjs
      - run: node skin/skin.mjs # template and theme come from skin/config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIN_USER: ${{ github.repository_owner }}
      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skin/*.svg skin/profile.json
          git diff --cached --quiet || (git commit -m "Update README skin" && git push)
