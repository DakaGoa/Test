  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;1" dur="1.05s"/>
    <text x="445" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6fbff">2014</text>
    <text x="445" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8fb8c4">Joined</text></g>
  <line x1="580" y1="36" x2="580" y2="184" stroke="#1c3d4a"/>
  <text x="620" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4ade80">Top languages <tspan fill="#8fb8c4" font-weight="400" font-size="14">by repo</tspan></text>
  <g clip-path="url(#track)">
