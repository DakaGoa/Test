    <text x="445" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Joined</text></g>
  <line x1="580" y1="36" x2="580" y2="184" stroke="#30363d"/>
  <text x="620" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58a6ff">Top languages <tspan fill="#8b949e" font-weight="400" font-size="14">by repo</tspan></text>
