    <text x="175" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a">Stars</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.90s"/>
    <text x="310" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f2f2f2">0</text>
    <text x="310" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a">Followers</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;1" dur="1.05s"/>
    <text x="445" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f2f2f2">2014</text>
    <text x="445" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a">Joined</text></g>
  <line x1="580" y1="36" x2="580" y2="184" stroke="#333333"/>
  <text x="620" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Top languages <tspan fill="#9a9a9a" font-weight="400" font-size="14">by repo</tspan></text>
  <g clip-path="url(#track)">
    <rect x="620" y="80" width="540" height="12" fill="#333333"/>
    <rect x="620" y="80" width="180" height="12" fill="#ffffff"><animate attributeName="width" values="0;0;180" keyTimes="0;0.000;1" dur="1.00s"/></rect>
    <rect x="800" y="80" width="180" height="12" fill="#bdbdbd"><animate attributeName="width" values="0;0;180" keyTimes="0;0.167;1" dur="1.20s"/></rect>
    <rect x="980" y="80" width="180" height="12" fill="#8c8c8c"><animate attributeName="width" values="0;0;180" keyTimes="0;0.286;1" dur="1.40s"/></rect>
