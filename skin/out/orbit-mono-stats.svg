  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.90s"/><circle cx="626" cy="130" r="6" fill="#ffffff"/>
    <text x="640" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2f2f2">C++ <tspan fill="#9a9a9a">33%</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="1.00s"/><circle cx="806" cy="130" r="6" fill="#bdbdbd"/>
