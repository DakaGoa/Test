    <linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient>
    <clipPath id="track"><rect x="620" y="80" width="540" height="12" rx="6"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="1199" height="219" rx="18" fill="url(#bg)" stroke="#333333"/>
