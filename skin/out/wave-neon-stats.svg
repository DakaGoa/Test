    <linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#00f0ff"/></linearGradient>
    <clipPath id="track"><rect x="620" y="80" width="540" height="12" rx="6"/></clipPath>
