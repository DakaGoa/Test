    <text x="445" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a491cc">Joined</text></g>
  <line x1="580" y1="36" x2="580" y2="184" stroke="#3d1f66"/>
  <text x="620" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ff2bd6">Top languages <tspan fill="#a491cc" font-weight="400" font-size="14">by repo</tspan></text>
