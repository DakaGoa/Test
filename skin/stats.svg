  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.200;1" dur="0.75s"/>
    <text x="175" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">0</text>
    <text x="175" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Stars</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.8999999999999999s"/>
    <text x="310" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">0</text>
    <text x="310" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Followers</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;1" dur="1.0499999999999998s"/>
    <text x="445" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">2014</text>
    <text x="445" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Joined</text></g>
  <line x1="580" y1="36" x2="580" y2="184" stroke="#30363d"/>
  <text x="620" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58a6ff">Top languages <tspan fill="#8b949e" font-weight="400" font-size="14">by repo</tspan></text>
  <g clip-path="url(#track)">
    <rect x="620" y="80" width="540" height="12" fill="#30363d"/>
    <rect x="620" y="80" width="180" height="12" fill="#58a6ff"><animate attributeName="width" values="0;180" dur="1s" begin="0.0s" fill="freeze"/></rect>
    <rect x="800" y="80" width="180" height="12" fill="#3fb950"><animate attributeName="width" values="0;180" dur="1s" begin="0.2s" fill="freeze"/></rect>
    <rect x="980" y="80" width="180" height="12" fill="#d29922"><animate attributeName="width" values="0;180" dur="1s" begin="0.4s" fill="freeze"/></rect>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.8999999999999999s"/><circle cx="626" cy="130" r="6" fill="#58a6ff"/>
    <text x="640" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">C++ <tspan fill="#8b949e">33%</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="1s"/><circle cx="806" cy="130" r="6" fill="#3fb950"/>
    <text x="820" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Rust <tspan fill="#8b949e">33%</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.455;1" dur="1.1s"/><circle cx="986" cy="130" r="6" fill="#d29922"/>
    <text x="1000" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">JavaScript <tspan fill="#8b949e">33%</tspan></text></g>
