<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>README Skin Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Workbench: pickers and the Activate button in a rail on the left, the live preview on the right; one column on phones. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #161a20; --muted: #5a6472; --line: #dce1e8;
  --stage: #e7ebf0; --accent: #b8245e; --accent-ink: #ffffff; --danger: #b3261e;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161b22; --ink: #e8ecf1; --muted: #9aa4b1; --line: #29313b;
    --stage: #0a0d11; --accent: #ff6b9e; --accent-ink: #2a0614; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161b22; --ink: #e8ecf1; --muted: #9aa4b1; --line: #29313b;
  --stage: #0a0d11; --accent: #ff6b9e; --accent-ink: #2a0614; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box }
.wrap, .rail, .stage, .readme { grid-template-columns: minmax(0, 1fr) } /* keep the 1200px-wide images from widening their column */
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body) }
.wrap {
  max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top h1 { font: 700 clamp(28px, 4vw, 40px)/1.1 var(--display); letter-spacing: -0.02em; margin: 0 0 8px; text-wrap: balance }
.top p { margin: 0; color: var(--muted); max-width: 62ch }
.bench { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 28px; align-items: start }
@media (max-width: 880px) { .bench { grid-template-columns: minmax(0, 1fr) } }
.rail { display: grid; gap: 24px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px }
legend { display: block; padding: 0; margin-bottom: 10px; font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0 }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.templates, .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.opt { position: relative; display: grid; gap: 4px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer }
.opt input { position: absolute; opacity: 0; pointer-events: none }
.opt:hover { border-color: var(--muted) }
.opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px }
.opt img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 1; border-radius: 5px; background: var(--stage) }
.opt-name { font-weight: 600 }
.opt-about { font-size: 12px; line-height: 1.35; color: var(--muted) }
.theme-opt { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px }
.swatch { display: flex; gap: 3px; padding: 5px; border: 1px solid var(--line); border-radius: 6px }
.swatch i { width: 9px; height: 9px; border-radius: 50% }
.go { display: grid; gap: 10px; padding-top: 20px; border-top: 1px solid var(--line) }
#activate { padding: 13px 16px; font: 600 16px var(--body); color: var(--accent-ink); background: var(--accent); border: 1px solid var(--accent); border-radius: 10px; cursor: pointer }
#activate:disabled { opacity: .55; cursor: not-allowed }
.note { margin: 0; font-size: 13px; color: var(--muted) }
.status { margin: 0; min-height: 1.55em; font-size: 14px }
.status.error { color: var(--danger) }
.stage { display: grid; gap: 12px; min-width: 0 }
h2 { margin: 0; font: 700 20px/1.2 var(--display) }
.readme { display: grid; gap: 14px; padding: clamp(12px, 3vw, 28px); background: var(--stage); border: 1px solid var(--line); border-radius: 14px }
.readme img { display: block; width: 100%; height: auto }
a { color: var(--accent) }
</style>

<main class="wrap">
  <header class="top">
    <h1>README Skin Builder</h1>
    <p>Pick a template and a theme, then press Activate. Your GitHub profile switches to it, and its numbers refresh every day.</p>
  </header>

  <div class="bench">
    <div class="rail">
      <fieldset><legend>Template</legend><div id="templates" class="templates"></div></fieldset>
      <fieldset><legend>Theme</legend><div id="themes" class="themes"></div></fieldset>
      <div class="go">
        <button id="activate" type="button" disabled>Activate</button>
        <p id="note" class="note"></p>
        <p id="status" class="status" role="status"></p>
      </div>
    </div>

    <section class="stage" aria-labelledby="preview-title">
      <h2 id="preview-title">Preview</h2>
      <div class="readme">
        <img id="p-header" alt="Profile header preview" width="1200" height="300">
        <img id="p-stats" alt="Stats card preview" width="1200" height="220">
      </div>
    </section>
  </div>
</main>

<script type="module">
import { THEMES, TEMPLATES, render } from "./skin/render.mjs";

const $ = (s) => document.querySelector(s);
const IMAGES = "https://raw.githubusercontent.com/DakaGoa/Test/HEAD/skin/out"; // the skin Action redraws these daily
// Shown until the saved profile loads; the note says it is a sample and Activate stays off.
const SAMPLE = {
  login: "", name: "Your Name", bio: "Short line about what you build", location: "Your city",
  stats: [["Repos", 24], ["Stars", 310], ["Followers", 128], ["Joined", "2018"]],
  languages: [{ name: "TypeScript", pct: 0.4 }, { name: "Python", pct: 0.25 }, { name: "Go", pct: 0.15 }, { name: "Shell", pct: 0.1 }],
};
const state = { profile: SAMPLE, template: "classic", theme: "github-dark" };
let urls = [];
let mcp = null;

const el = (tag, className = "", text = "") => Object.assign(document.createElement(tag), { className, textContent: text });
const svgUrl = (svg) => { const u = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })); urls.push(u); return u; };
const status = (text, isError = false, href) => {
  $("#status").textContent = text;
  $("#status").classList.toggle("error", isError);
  if (href) $("#status").append(" ", Object.assign(document.createElement("a"), { href, target: "_blank", rel: "noopener", textContent: href.replace("https://", "") }));
};

function draw() {
  for (const u of urls) URL.revokeObjectURL(u);
  urls = [];
  const files = render(state.profile, state.template, state.theme);
  $("#p-header").src = svgUrl(files["header.svg"]);
  $("#p-stats").src = svgUrl(files["stats.svg"]);
  for (const img of document.querySelectorAll("img[data-template]"))
    img.src = svgUrl(TEMPLATES[img.dataset.template].header(state.profile, THEMES[state.theme]));
}

function addOptions(container, name, entries, build) {
  for (const [value, item] of entries) {
    const label = el("label", `opt ${name}-opt`);
    const input = Object.assign(document.createElement("input"), { type: "radio", name, value, id: `${name}-${value}`, checked: value === state[name] });
    input.addEventListener("change", () => { state[name] = value; draw(); });
    label.append(input, ...build(value, item));
    container.append(label);
  }
}

const readme = (t, th) => `<!-- README skin: ${t} / ${th}. Switch it in the README Skin Builder. -->
<p align="center">
  <img src="${IMAGES}/${t}-${th}-header.svg" width="100%" alt="Profile header">
</p>

<p align="center">
  <img src="${IMAGES}/${t}-${th}-stats.svg" width="100%" alt="GitHub stats and top languages">
</p>
`;

// Composio wraps each tool's answer; a failure can sit at the top or on the one result.
function composioError(p) {
  if (!p || typeof p !== "object") return "Composio sent back an answer this page doesn't understand.";
  const r = p.data?.results?.[0];
  const inner = r?.response ?? r ?? {};
  if (p.successful === false || inner.successful === false || inner.error || p.error) return String(inner.error || p.error || "Composio reported that the change failed.");
  return null;
}

function failure(e) {
  switch (e?.code) {
    case "server_not_connected": return "Composio isn't connected to claude.ai. Add it in Settings → Connectors, then press Activate again.";
    case "needs_reauth": return "Your Composio connection has expired. Reconnect it in claude.ai Settings → Connectors, then press Activate again.";
    case "not_in_manifest": case "approval_required": case "consent_required":
      return "Activate needs your OK to use Composio. Press Activate again and choose Allow.";
    case "server_unavailable": case "upstream_error": case "cancelled":
      return "Composio didn't answer, so the switch may or may not have gone through. Check your profile before pressing Activate again.";
    default:
      return /connect/i.test(e?.message ?? "")
        ? "GitHub isn't connected in Composio yet. Connect it there, then press Activate again."
        : e?.message || "The switch didn't go through.";
  }
}

const local = async (path) => { try { const r = await fetch(path); return r.ok ? await r.json() : null; } catch { return null; } };
const profile = await local("skin/profile.json");
if (profile?.login) state.profile = profile;

addOptions($("#templates"), "template", Object.entries(TEMPLATES), (value, tpl) => {
  const img = Object.assign(document.createElement("img"), { alt: "", width: 1200, height: 300 });
  img.dataset.template = value;
  return [img, el("span", "opt-name", tpl.label), el("span", "opt-about", tpl.about)];
});
addOptions($("#themes"), "theme", Object.entries(THEMES), (value, th) => {
  const swatch = el("span", "swatch");
  swatch.style.background = th.bg;
  for (const c of th.palette) { const dot = el("i"); dot.style.background = c; swatch.append(dot); }
  return [swatch, el("span", "opt-name", value)];
});
draw();

const login = state.profile.login;
$("#note").textContent = login
  ? `Activate replaces the README on github.com/${login}. Your current one stays in that repository's history.`
  : "Showing a sample profile. Activate turns on once the skin Action has run for your account.";

// Activate writes through the viewer's Composio connector, which only pages opened on claude.ai can reach.
mcp = await (window.claude?.use?.("mcp") ?? null);
if (!mcp && login) $("#note").textContent = "Open this builder on claude.ai to activate it with one click.";
$("#activate").disabled = !mcp || !login;

$("#activate").addEventListener("click", async () => {
  const { template, theme } = state;
  const label = `${TEMPLATES[template].label} · ${theme}`;
  $("#activate").disabled = true;
  status(`Switching your profile to ${label}…`);
  try {
    const res = await mcp.callTool("Composio", "COMPOSIO_MULTI_EXECUTE_TOOL", {
      tools: [{
        tool_slug: "GITHUB_CREATE_OR_UPDATE_FILE_CONTENTS",
        arguments: { owner: login, repo: login, path: "README.md", message: `Switch README skin to ${template} / ${theme}`, content: readme(template, theme) },
      }],
      sync_response_to_workbench: false,
      thought: "Switch the GitHub profile README to the skin picked in the builder.",
    });
    const err = composioError(res.payload);
    if (err) throw { message: err };
    status(`${label} is live. GitHub can take a minute to show it:`, false, `https://github.com/${login}`);
  } catch (e) {
    status(failure(e), true);
  } finally {
    $("#activate").disabled = false;
  }
});
</script>
